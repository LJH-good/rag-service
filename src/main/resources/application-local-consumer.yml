# =============================================================================
# Profile: local-consumer
# 로컬 PC에서 Consumer만 기동 — PCC / EMBED / UPSERT (HTTP 포트 없음)
#
#   [로컬]  Control Plane GW :9002 (EMBED) | AI GW :9001 | LangChain :8000
#   [원격]  PG :30543 | MinIO :9900(134) / public https://minio.ncsol.co.kr | Qdrant :30633
# =============================================================================

server:
  port: 0

spring:
  datasource:
    url: ${RAG_LOCAL_DATASOURCE_URL}
    username: ${RAG_LOCAL_DATASOURCE_USERNAME}
    password: ${RAG_LOCAL_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${RAG_DB_MAX_POOL_SIZE:8}
      minimum-idle: ${RAG_DB_MIN_IDLE:1}
      connection-timeout: ${RAG_DB_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: ${RAG_DB_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${RAG_DB_IDLE_TIMEOUT_MS:600000}
      leak-detection-threshold: ${RAG_DB_LEAK_DETECTION_MS:20000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: rag
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
      timeout: 20s

rag:
  env: local

  categories:
    personal-category-id: ${RAG_PERSONAL_CATEGORY_ID:61911ccb-8733-4b2b-9476-25d2347605a9}

  app:
    role: consumer

  storage:
    key-prefix: rag
    minio:
      endpoint: ${MINIO_END_POINT}
      public-url: ${MINIO_PUBLIC_URL}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}

  qdrant:
    base-url: ${RAG_QDRANT_BASE_URL}
    collection: ${RAG_QDRANT_COLLECTION}
    timeout-ms: ${RAG_QDRANT_TIMEOUT_MS:10000}
    top-k-default: ${RAG_QDRANT_TOP_K_DEFAULT:5}

  gateway:
    base-url: ${GATEWAY_URL:http://localhost:9002}
    embedding-timeout-seconds: ${RAG_GATEWAY_EMBEDDING_TIMEOUT_SECONDS:120}
    embedding-rate-limit-retry-count: ${RAG_GATEWAY_EMBEDDING_RATE_LIMIT_RETRY_COUNT:16}
    embedding-rate-limit-retry-base-delay-ms: ${RAG_GATEWAY_EMBEDDING_RATE_LIMIT_RETRY_BASE_DELAY_MS:800}
    embedding-rate-limit-retry-max-delay-ms: ${RAG_GATEWAY_EMBEDDING_RATE_LIMIT_RETRY_MAX_DELAY_MS:45000}
    max-in-memory-size-bytes: ${RAG_GATEWAY_MAX_IN_MEMORY_SIZE_BYTES:10485760}

  embedding:
    ai-service-name: ${RAG_EMBEDDING_AI_SERVICE_NAME:openai}

  worker:
    delay-ms: ${RAG_WORKER_DELAY_MS:1000}
    embed-batch-size: ${RAG_WORKER_EMBED_BATCH_SIZE:4}
    embed-inter-batch-delay-ms: ${RAG_WORKER_EMBED_INTER_BATCH_DELAY_MS:1000}
    stuck-job-timeout-minutes: ${RAG_WORKER_STUCK_JOB_TIMEOUT_MINUTES:5}

  chunk:
    max-chars: ${RAG_CHUNK_MAX_CHARS:500}
    overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:120}
    min-chars: ${RAG_CHUNK_MIN_CHARS:40}

  pcc:
    langchain-enabled: true
    base-url: ${RAG_PCC_LANGCHAIN_BASE_URL:http://localhost:8000}
    invoke-path: ${RAG_PCC_LANGCHAIN_INVOKE_PATH:/api/internal/rag/pcc/ingest}
    presign-expiry-seconds: ${RAG_PCC_PRESIGN_EXPIRY_SECONDS:3600}
    timeout-ms: ${RAG_PCC_LANGCHAIN_TIMEOUT_MS:120000}
    max-in-memory-size-bytes: ${RAG_PCC_LANGCHAIN_MAX_IN_MEMORY_SIZE_BYTES:157286400}

  # Graph RAG Pass2(관계 추출). enabled=false 면 UPSERT 가 terminal 로 남아 파이프라인 영향 없음(opt-in).
  # 문서 용량 기준: light=openai+CHEAP, heavy=claude+PREMIUM. model-code 는 선택적 고정(있으면 preference 무시).
  graph:
    enabled: ${RAG_GRAPH_ENABLED:true}
    light-ai-service-name: ${RAG_GRAPH_LIGHT_AI_SERVICE_NAME:openai}
    heavy-ai-service-name: ${RAG_GRAPH_HEAVY_AI_SERVICE_NAME:claude}
    size-threshold-bytes: ${RAG_GRAPH_SIZE_THRESHOLD_BYTES:1048576}
    light-model-code: ${RAG_GRAPH_LIGHT_MODEL_CODE:}
    heavy-model-code: ${RAG_GRAPH_HEAVY_MODEL_CODE:}
    timeout-seconds: ${RAG_GRAPH_TIMEOUT_SECONDS:900}
    chunk-batch-size: ${RAG_GRAPH_CHUNK_BATCH_SIZE:8}
    max-chars-per-chunk: ${RAG_GRAPH_MAX_CHARS_PER_CHUNK:4000}
    # Pass1 entity:link Redis 캐시 TTL(초). 0 이하면 만료 없음(기본 7일)
    entity-link-ttl-seconds: ${RAG_GRAPH_ENTITY_LINK_TTL_SECONDS:604800}
