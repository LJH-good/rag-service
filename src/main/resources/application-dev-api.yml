# =============================================================================
# Profile: dev-api
# K8s dev 배포 / GitOps values-api.yaml 과 동일 의미 (환경변수로 덮어씀)
#
#   API :8080 | 클러스터 DNS: aigateway, gateway, langchain-service
#   PG/MinIO/Qdrant: ConfigMap·Secret (기본값은 아래 env placeholder)
# 로컬 PC 테스트는 local-api 프로필 사용.
# =============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 72MB
      max-request-size: 72MB

  datasource:
    url: ${RAG_DEV_DATASOURCE_URL}
    username: ${RAG_DEV_DATASOURCE_USERNAME}
    password: ${RAG_DEV_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${RAG_DB_MAX_POOL_SIZE:8}
      minimum-idle: ${RAG_DB_MIN_IDLE:1}
      connection-timeout: ${RAG_DB_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: ${RAG_DB_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${RAG_DB_IDLE_TIMEOUT_MS:600000}
      leak-detection-threshold: ${RAG_DB_LEAK_DETECTION_MS:20000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: rag
        jdbc:
          time_zone: Asia/Seoul

rag:
  env: ${RAG_ENV:dev}

  categories:
    personal-category-id: ${RAG_PERSONAL_CATEGORY_ID}

  app:
    role: api

  storage:
    key-prefix: ${RAG_STORAGE_KEY_PREFIX:rag}
    minio:
      endpoint: ${MINIO_END_POINT}
      public-url: ${MINIO_PUBLIC_URL}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET}

  qdrant:
    base-url: ${RAG_QDRANT_BASE_URL}
    collection: ${RAG_QDRANT_COLLECTION}
    timeout-ms: ${RAG_QDRANT_TIMEOUT_MS:3000}
    top-k-default: ${RAG_QDRANT_TOP_K_DEFAULT:5}

  graph:
    # 검색측 그래프 traverse + RRF 융합 게이트(off 면 벡터-only)
    enabled: ${RAG_GRAPH_ENABLED:true}

  gateway:
    base-url: ${GATEWAY_URL}
    embedding-timeout-seconds: ${RAG_GATEWAY_EMBEDDING_TIMEOUT_SECONDS:120}
    embedding-rate-limit-retry-count: ${RAG_GATEWAY_EMBEDDING_RATE_LIMIT_RETRY_COUNT:16}
    embedding-rate-limit-retry-base-delay-ms: ${RAG_GATEWAY_EMBEDDING_RATE_LIMIT_RETRY_BASE_DELAY_MS:800}
    embedding-rate-limit-retry-max-delay-ms: ${RAG_GATEWAY_EMBEDDING_RATE_LIMIT_RETRY_MAX_DELAY_MS:45000}
    max-in-memory-size-bytes: ${RAG_GATEWAY_MAX_IN_MEMORY_SIZE_BYTES:10485760}

  embedding:
    ai-service-name: ${RAG_EMBEDDING_AI_SERVICE_NAME:openai}

  upload:
    max-file-size-bytes: ${RAG_UPLOAD_MAX_FILE_SIZE_BYTES:20971520}

  worker:
    embed-batch-size: ${RAG_WORKER_EMBED_BATCH_SIZE:4}
    embed-inter-batch-delay-ms: ${RAG_WORKER_EMBED_INTER_BATCH_DELAY_MS:1000}

  langchain-service:
    enabled: ${RAG_LANGCHAIN_ENABLED:true}
    base-url: ${RAG_LANGCHAIN_BASE_URL}
    timeout-ms: ${RAG_LANGCHAIN_TIMEOUT_MS:30000}
    max-in-memory-size-bytes: ${RAG_LANGCHAIN_MAX_IN_MEMORY_SIZE_BYTES:10485760}

  qa:
    langchain-path: ${RAG_QA_LANGCHAIN_PATH:/api/rag/{aiServiceName}/qa}

  pcc:
    langchain-enabled: ${RAG_PCC_LANGCHAIN_ENABLED:true}
    base-url: ${RAG_PCC_LANGCHAIN_BASE_URL:http://langchain-service.app-dev.svc.cluster.local:8000}
    invoke-path: ${RAG_PCC_LANGCHAIN_INVOKE_PATH:/api/internal/rag/pcc/ingest}
    presign-expiry-seconds: ${RAG_PCC_PRESIGN_EXPIRY_SECONDS:3600}
    timeout-ms: ${RAG_PCC_LANGCHAIN_TIMEOUT_MS:120000}
    max-in-memory-size-bytes: ${RAG_PCC_LANGCHAIN_MAX_IN_MEMORY_SIZE_BYTES:157286400}
