stages:
  - build
  - update-gitops

variables:
  HARBOR_REGISTRY: "harbor.ncsol.co.kr"
  HARBOR_PROJECT: "rag"
  APP_NAME: "rag-storage-service"
  GITOPS_REPO: "infra/gitops"

.build_template:
  stage: build
  image:
    name: harbor.ncsol.co.kr/heimdal/kaniko:debug
    entrypoint: [""]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json

.update_gitops_template:
  stage: update-gitops
  image: harbor.ncsol.co.kr/heimdal/alpine-git:latest
  before_script:
    - git config --global user.email "gitlab-ci@rag"
    - git config --global user.name "GitLab CI"
    - git config --global http.sslVerify false

build-dev:
  extends: .build_template
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
      --insecure
      --insecure-pull
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

update-gitops-dev:
  extends: .update_gitops_template
  script:
    - git clone http://oauth2:${GITOPS_TOKEN}@${GITLAB_INTERNAL_URL}/${GITOPS_REPO}.git gitops
    - cd gitops
    - git remote set-url origin http://oauth2:${GITOPS_TOKEN}@${GITLAB_INTERNAL_URL}/${GITOPS_REPO}.git
    - 'test -d "dev-config/${APP_NAME}" || { echo "directory not found: dev-config/${APP_NAME}"; find . -maxdepth 4 | sort; exit 1; }'
    - |
      for file in dev-config/${APP_NAME}/values-*.yaml; do
        [ -f "$file" ] || continue
        echo "update tag -> $file"
        sed -i "s|^\([[:space:]]*tag:\).*|\1 ${CI_COMMIT_SHORT_SHA}|" "$file"
      done
    - git add dev-config/${APP_NAME}/values-*.yaml
    - 'git diff --cached --quiet && echo "No changes to commit" || git commit -m "ci: update ${APP_NAME} dev image to ${CI_COMMIT_SHORT_SHA}"'
    - git push
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build-prod:
  extends: .build_template
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${APP_NAME}:${CI_COMMIT_TAG}"
      --insecure
      --insecure-pull
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'

update-gitops-prod:
  extends: .update_gitops_template
  script:
    - git clone http://oauth2:${GITOPS_TOKEN}@${GITLAB_INTERNAL_URL}/${GITOPS_REPO}.git gitops
    - cd gitops
    - git remote set-url origin http://oauth2:${GITOPS_TOKEN}@${GITLAB_INTERNAL_URL}/${GITOPS_REPO}.git
    - 'test -d "prod-config/${APP_NAME}" || { echo "directory not found: prod-config/${APP_NAME}"; find . -maxdepth 4 | sort; exit 1; }'
    - |
      for file in prod-config/${APP_NAME}/values-*.yaml; do
        [ -f "$file" ] || continue
        echo "update tag -> $file"
        sed -i "s|^\([[:space:]]*tag:\).*|\1 ${CI_COMMIT_TAG}|" "$file"
      done
    - git add prod-config/${APP_NAME}/values-*.yaml
    - 'git diff --cached --quiet && echo "No changes to commit" || git commit -m "ci: update ${APP_NAME} prod image to ${CI_COMMIT_TAG}"'
    - git push
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'