# 로컬 PC 인프라 — PostgreSQL / MinIO / Qdrant
# Redis는 langchain-service 쪽에서 이미 langchain-redis-local(:6379)로 떠 있어 여기 포함하지 않음.
# MinIO 콘솔(9001)은 gateway 프로젝트가 쓰는 호스트 포트 9001과 겹쳐서 9091로 매핑함
# (S3 API 포트 9000, .env의 MINIO_END_POINT 등은 그대로 사용).
#
# 사용:
#   docker compose -f docker-compose.local-infra.yml up -d
#
# 기동 후 .env 는 아래 값을 가리키도록 맞춰야 함:
#   RAG_LOCAL_DATASOURCE_URL=jdbc:postgresql://localhost:5432/rag
#   RAG_LOCAL_DATASOURCE_USERNAME=rag_user
#   RAG_LOCAL_DATASOURCE_PASSWORD=rag_password
#   MINIO_END_POINT=http://localhost:9000
#   MINIO_PUBLIC_URL=http://localhost:9000
#   MINIO_ACCESS_KEY=minioadmin
#   MINIO_SECRET_KEY=minioadmin123
#   MINIO_BUCKET=rag
#   RAG_QDRANT_BASE_URL=http://localhost:6333
#   RAG_QDRANT_COLLECTION=rag_chunks
services:
  postgres:
    image: postgres:16
    container_name: rag-postgres-local
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - rag_postgres_local_data:/var/lib/postgresql/data
      - ./scripts/local-infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant-local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - rag_qdrant_local_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: rag-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9091:9001"
    volumes:
      - rag_minio_local_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: rag-minio-init-local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/rag &&
      exit 0
      "
    restart: "no"

volumes:
  rag_postgres_local_data:
  rag_qdrant_local_data:
  rag_minio_local_data:
